name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [core, molmospaces]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        env:
          JUST_VERSION: "1.50.0"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Run required PR gate
        run: just agent::verify "${{ matrix.shard }}"

      - name: Run deterministic eval baseline subset
        if: matrix.shard == 'core'
        env:
          MIMO_RESPONSES_MODEL: ignored-in-ci
          KIMI_API_KEY: placeholder
          MM_API_KEY: placeholder
        run: just agent::eval recommend profile=baseline-ci budget=focused

      - name: Check public release candidate
        if: matrix.shard == 'core'
        run: | # pragma: allowlist secret
          candidate_root="$(mktemp -d)"
          trap 'rm -rf "$candidate_root"' EXIT
          .venv/bin/python scripts/dev/build_public_candidate.py --output "$candidate_root"
          .venv/bin/python scripts/dev/check_public_surface.py --root "$candidate_root"
          current_scan="$(mktemp)"
          (
            cd "$candidate_root"
            uvx --from detect-secrets==1.5.0 detect-secrets scan \
              --exclude-files '(PUBLIC-MEMBERSHIP\.json|\.secrets\.baseline)' \
              > "$current_scan"
            diff -u \
              <(jq -S '.results' .secrets.baseline) \
              <(jq -S '.results' "$current_scan")
          )

      - name: Upload required-gate output
        uses: actions/upload-artifact@v4
        if: always() && matrix.shard == 'core'
        with:
          name: report-required
          path: output/demo/**
          if-no-files-found: warn

  lint-and-mock:
    name: Lint & mock tests
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification shard to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
