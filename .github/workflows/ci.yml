name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-mock:
    name: Lint & mock tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        env:
          JUST_VERSION: "1.50.0"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Run required PR gate
        run: just agent::verify

      - name: Check public release candidate
        run: |
          candidate_root="$(mktemp -d)"
          trap 'rm -rf "$candidate_root"' EXIT
          .venv/bin/python scripts/dev/build_public_candidate.py --output "$candidate_root"
          .venv/bin/python scripts/dev/check_public_surface.py --root "$candidate_root"

      - name: Upload required-gate output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-required
          path: output/demo/**
          if-no-files-found: warn
