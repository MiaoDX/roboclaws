name: Capability showcase

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      live_execution:
        description: "Set run to execute provider-backed showcase rows on this branch"
        required: false
        default: "blocked"

permissions:
  contents: read

concurrency:
  group: capability-showcase
  cancel-in-progress: false

jobs:
  provider-showcase:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_execution == 'run')
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - provider: kimi
            row_args: --row-id household_world.map_build_quality --row-id household_world.cleanup_capability.kimi --row-id household_world.open_ended_goals.kimi
          - provider: mimo
            row_args: --row-id household_world.cleanup_capability.mimo --row-id household_world.open_ended_goals.mimo
          - provider: minimax
            row_args: --row-id household_world.cleanup_capability.minimax --row-id household_world.open_ended_goals.minimax
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless MuJoCo rendering runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libgles2 libegl-mesa0
      - run: uv sync --extra dev
      - name: Run ${{ matrix.provider }} showcase shard
        env:
          KIMI_API_KEY: ${{ matrix.provider == 'kimi' && secrets.KIMI_API_KEY || '' }}
          KIMI_OPENAI_BASE_URL: ${{ matrix.provider == 'kimi' && secrets.KIMI_OPENAI_BASE_URL || '' }}
          MIMO_TP_KEY: ${{ matrix.provider == 'mimo' && secrets.MIMO_TP_KEY || '' }}
          MIMO_OPENAI_BASE_URL: ${{ matrix.provider == 'mimo' && secrets.MIMO_OPENAI_BASE_URL || '' }}
          MM_API_KEY: ${{ matrix.provider == 'minimax' && secrets.MM_API_KEY || '' }}
          MM_BASE_URL: ${{ matrix.provider == 'minimax' && secrets.MM_BASE_URL || '' }}
        run: |
          mkdir -p "output/showcase/${{ matrix.provider }}"
          .venv/bin/python -m roboclaws.evals.showcase \
            --manifest config/showcase-manifest.json \
            --output "output/showcase/${{ matrix.provider }}" \
            --execute --live-execution run \
            ${{ matrix.row_args }}
      - name: Upload ${{ matrix.provider }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-${{ matrix.provider }}-${{ github.sha }}
          path: output/showcase/${{ matrix.provider }}/**
          if-no-files-found: warn

  showcase:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: provider-showcase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Download Kimi evidence
        if: github.event_name == 'schedule' || inputs.live_execution == 'run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: showcase-kimi-${{ github.sha }}
          path: output/showcase/kimi
      - name: Download MiMo evidence
        if: github.event_name == 'schedule' || inputs.live_execution == 'run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: showcase-mimo-${{ github.sha }}
          path: output/showcase/mimo
      - name: Download MiniMax evidence
        if: github.event_name == 'schedule' || inputs.live_execution == 'run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: showcase-minimax-${{ github.sha }}
          path: output/showcase/minimax
      - name: Run deterministic smoke baseline
        if: github.event_name == 'schedule' || inputs.live_execution == 'run'
        run: |
          mkdir -p output/showcase/smoke
          .venv/bin/python -m roboclaws.evals.showcase \
            --manifest config/showcase-manifest.json \
            --output output/showcase/smoke \
            --execute --live-execution blocked \
            --row-id household_world.smoke_regression
      - name: Restore durable last-success pointers
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}/showcase-summary-v1.json
        run: curl --fail --silent --show-error "$PAGES_URL" -o output/showcase/previous.json
      - name: Record showcase without live provider request
        if: github.event_name == 'workflow_dispatch' && inputs.live_execution != 'run'
        continue-on-error: true
        run: |
          mkdir -p output/showcase/preview
          .venv/bin/python -m roboclaws.evals.showcase \
            --manifest config/showcase-manifest.json \
            --output output/showcase/preview \
            --execute --live-execution blocked
      - name: Build sanitized summary and latest projection
        if: always()
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          .venv/bin/python -m roboclaws.evals.showcase \
            --manifest config/showcase-manifest.json \
            --output output/showcase/site \
            --commit "${{ github.sha }}" \
            --run-url "$RUN_URL" \
            --artifact-url "$RUN_URL#artifacts" \
            --execution-index output/showcase/smoke/execution.json \
            --execution-index output/showcase/kimi/execution.json \
            --execution-index output/showcase/mimo/execution.json \
            --execution-index output/showcase/minimax/execution.json \
            --execution-index output/showcase/preview/execution.json \
            --previous output/showcase/previous.json
      - name: Publish report drilldowns
        if: always()
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from roboclaws.evals.public_reports import publish_report_bundle

          for shard in ("smoke", "kimi", "mimo", "minimax"):
              source = Path("output/showcase") / shard / "evals"
              destination = Path("output/showcase/site/reports") / shard / "evals"
              if source.is_dir():
                  publish_report_bundle(source, destination)
          PY
      - name: Upload canonical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-showcase-${{ github.sha }}
          path: output/showcase/*/evals/**
          if-no-files-found: warn
      - name: Upload showcase summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-summary-${{ github.sha }}
          path: output/showcase/site/**
      - name: Require model-backed showcase success
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_execution == 'run')
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("output/showcase/site/showcase-summary-v1.json").read_text(encoding="utf-8")
          )
          unsuccessful = [row["id"] for row in summary["rows"] if row["status"] != "passed"]
          if unsuccessful:
              raise SystemExit(f"showcase rows did not pass: {', '.join(unsuccessful)}")
          PY

  deploy-pages:
    if: always() && github.ref == 'refs/heads/main'
    needs: showcase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download showcase projection
        uses: actions/download-artifact@v4
        with:
          name: showcase-summary-${{ github.sha }}
          path: site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - name: Deploy latest advisory showcase
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
