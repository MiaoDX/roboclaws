[project]
name = "roboclaws"
version = "0.1.0"
description = "Visible household robot cleanup, mapping, and planner-proof demos"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
molmospaces = [
    "molmo-spaces[mujoco] @ git+https://github.com/allenai/molmospaces.git@3c50ae6093f7e4a4ef32529f8a773715da410a2f",
    "torch==2.7.1+cpu",
    "torchvision==0.22.1+cpu",
]
visual-grounding-dino = [
    "torch==2.7.1+cpu",
    "transformers>=4.52,<5",
]
visual-grounding-yoloe = [
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "ultralytics>=8.3",
]
dev = [
    "openai>=1.50",
    "openai-agents[docker]==0.19.2",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "imageio>=2.30",
    "mcp[cli]>=1.27",
    "molmo-spaces[mujoco] @ git+https://github.com/allenai/molmospaces.git@3c50ae6093f7e4a4ef32529f8a773715da410a2f",
    "torch==2.7.1+cpu",
    "torchvision==0.22.1+cpu",
]
openai-agents = [
    "openai-agents==0.19.2",
]

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/dist",
    "/output",
    "/vendors",
    "/evals",
    "/roboclaws/evals",
    "/skills/eval-harness",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendors"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q --strict-markers"
markers = [
    "unit: fast isolated behavior tests through public module APIs.",
    "contract: public schema, CLI, MCP tool, replay, report, and artifact compatibility tests.",
    "local: requires local GPU, paid API key, real simulator, or backend service.",
    "slow: CI-safe but expensive enough to exclude from tight feedback loops.",
]
