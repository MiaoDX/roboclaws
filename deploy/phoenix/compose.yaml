services:
  phoenix:
    image: arizephoenix/phoenix:11.20.0
    restart: "no"
    ports:
      - "127.0.0.1:${PHOENIX_HTTP_PORT:-6006}:6006"
      - "127.0.0.1:${PHOENIX_GRPC_PORT:-4317}:4317"
    volumes:
      - phoenix-data:/root/.phoenix
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

volumes:
  phoenix-data:
